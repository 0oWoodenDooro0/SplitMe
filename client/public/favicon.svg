<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="splitme-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="splitme-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="splitme-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#splitme-grad)" />
  
  <!-- Subtle Inner Glow -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#6ee7b7" stroke-width="4" opacity="0.3" />
  
  <!-- Modern Split Nodes Symbol -->
  <g filter="url(#splitme-shadow)">
    <!-- Main Node Branch (Bottom to Fork) -->
    <path d="M 256 400 L 256 260" stroke="#ffffff" stroke-width="36" stroke-linecap="round" />
    
    <!-- Left Branch -->
    <path d="M 256 260 Q 256 200 170 140" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" />
    
    <!-- Right Branch -->
    <path d="M 256 260 Q 256 200 342 140" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" />
    
    <!-- Bottom Base Node -->
    <circle cx="256" cy="400" r="32" fill="#ffffff" />
    <circle cx="256" cy="400" r="16" fill="#059669" />
    
    <!-- Center Fork Node -->
    <circle cx="256" cy="260" r="22" fill="#ffffff" />
    
    <!-- Top Left Node (Split Target 1) -->
    <circle cx="160" cy="130" r="38" fill="#ffffff" />
    <circle cx="160" cy="130" r="20" fill="url(#splitme-accent)" />
    
    <!-- Top Right Node (Split Target 2) -->
    <circle cx="352" cy="130" r="38" fill="#ffffff" />
    <circle cx="352" cy="130" r="20" fill="url(#splitme-accent)" />
  </g>
  
  <!-- Sparkle Accent -->
  <path d="M 400 80 Q 400 100 420 100 Q 400 100 400 120 Q 400 100 380 100 Q 400 100 400 80 Z" fill="#FDE047" />
</svg>
